name: Build executables

# Builds The Rubbish Game for Windows, macOS, Linux and Android and uploads
# each as a workflow artifact. Run it on demand from the Actions tab, or it
# runs automatically when the game code or build config changes.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - claude/github-action-multiplatform-build-lktxh4
    paths:
      - '**.py'
      - '_internal/**'
      - 'requirements.txt'
      - 'rubbishgame.spec'
      - 'buildozer.spec'
      - '.github/workflows/build.yml'

jobs:
  # ---------------------------------------------------------------------------
  # Desktop builds (Windows / macOS / Linux) via PyInstaller
  # ---------------------------------------------------------------------------
  desktop:
    name: Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          - os: ubuntu-latest
            name: linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linux SDL/system dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libsdl2-2.0-0 libsdl2-image-2.0-0 libsdl2-mixer-2.0-0 \
            libsdl2-ttf-2.0-0 libfreetype6 libportmidi0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean rubbishgame.spec

      - name: Package build (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist/TheRubbishGame/* `
            -DestinationPath dist/TheRubbishGame-windows.zip

      - name: Package build (macOS)
        if: matrix.name == 'macos'
        run: |
          cd dist
          # Prefer the .app bundle if it was produced.
          if [ -d "TheRubbishGame.app" ]; then
            zip -ry TheRubbishGame-macos.zip TheRubbishGame.app
          else
            zip -ry TheRubbishGame-macos.zip TheRubbishGame
          fi

      - name: Package build (Linux)
        if: matrix.name == 'linux'
        run: |
          cd dist
          tar -czf TheRubbishGame-linux.tar.gz TheRubbishGame

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rubbishgame-${{ matrix.name }}
          path: |
            dist/TheRubbishGame-*.zip
            dist/TheRubbishGame-*.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Android build via Buildozer / python-for-android
  # ---------------------------------------------------------------------------
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev \
            build-essential ccache libltdl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade buildozer cython==0.29.36

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-global-

      - name: Build debug APK
        run: |
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rubbishgame-android
          path: bin/*.apk
          if-no-files-found: error
